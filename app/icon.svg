<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .ring { fill: none; stroke: #0A0A0A; stroke-width: 8; stroke-linecap: round; }
    .core { fill: #0A0A0A; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #F4F1EA; }
      .core { fill: #F4F1EA; }
    }
  </style>
  <ellipse class="ring" cx="50" cy="50" rx="46" ry="20" transform="rotate(35 50 50)"/>
  <ellipse class="ring" cx="50" cy="50" rx="46" ry="20" transform="rotate(-35 50 50)"/>
  <circle class="core" cx="50" cy="50" r="8"/>
</svg>
