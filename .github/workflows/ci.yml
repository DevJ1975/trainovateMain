name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build collects page data with NODE_ENV=production. The
          # session-secret guard skips the throw during NEXT_PHASE=build,
          # but we set a real value here too so any future runtime check
          # in the build pipeline (e.g. ISG) doesn't surprise us.
          SESSION_SECRET: ci-build-only-secret-not-used-for-real-tokens-32chars
